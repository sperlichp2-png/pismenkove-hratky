<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Písmenkové hrátky</title>
<link rel="icon" type="image/png" href="favicon-64.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#40aaff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hrátky">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@500;700;800&display=swap&subset=latin-ext" rel="stylesheet">
<style>
/* VOICE: veselá, laskavá, ovládání obrázky a hlasem pro děti, které ještě nečtou
   IDEA: magnetická tabule s barevnými dřevěnými kostkami písmen a čísel
   PICTURE: velké obrázkové dlaždice her, velký obrázek úkolu, kostky k ťukání
   COLOUR and TYPE: slunečná žlutá, červená (písmenka), modrá (čísla); Baloo 2 + Nunito
   LAYOUT: profil → svět (písmenka/čísla) → mřížka obrázkových her → hrací plocha */
:root{color-scheme:light dark;
--bg:light-dark(#fff7d6,#141a2e);--board:light-dark(#ffffff,#1e2742);--ink:light-dark(#1d2340,#f3f1ea);
--soft:light-dark(#5b6283,#aab0c9);--y:#ffc93c;--b:#2b59c3;--r:#e8433a;--g:#25a36b;--line:light-dark(#e9dfb8,#2d3756);--pale:light-dark(#f2ecd4,#2a3454)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 Nunito,system-ui,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;min-height:44px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--b);outline-offset:2px}
.wrap{max-width:920px;margin:0 auto;padding:12px max(3vw,12px) 40px}
.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.round{width:54px;height:54px;border-radius:50%;background:var(--board);border:3px solid var(--line);display:grid;place-items:center;font-size:26px;flex:none}
.round svg{width:28px;height:28px}
.me{display:flex;align-items:center;gap:8px;flex:1;background:var(--board);border:3px solid var(--line);border-radius:99px;padding:3px 14px 3px 4px}
.me .av{font-size:34px;line-height:1}
.me b{font:800 20px "Baloo 2",sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog{flex:1;min-width:60px}
.lvl{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:var(--b);color:#fff;font:800 22px "Baloo 2",sans-serif;flex:none;box-shadow:0 3px 0 #173a8a}
.goal{display:flex;align-items:center;gap:10px;width:100%;background:var(--board);border:3px solid var(--line);border-radius:22px;padding:4px 16px;margin-bottom:12px}
.goal b{font:800 18px "Baloo 2",sans-serif;white-space:nowrap}.goal.done{border-color:var(--g)}
.goal .prog i{height:16px}
.ah{font:800 26px "Baloo 2",sans-serif;margin:22px 0 10px;display:flex;align-items:center;justify-content:center;gap:8px}
.bdgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.bdg{background:var(--pale);border-radius:18px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px}
.bdg span{font-size:44px;line-height:1.1}.bdg small{font:800 12px/1.15 Nunito,sans-serif;color:var(--soft)}
.bdg.lock span{filter:grayscale(1);opacity:.3}
.grow{display:flex;gap:10px;margin-bottom:12px}.grow .goal{margin:0;flex:1}
.coin{display:flex;align-items:center;gap:6px;background:var(--board);border:3px solid var(--line);border-radius:22px;padding:4px 12px;position:relative}
.coin span{font-size:30px}.coin b{font:800 20px "Baloo 2",sans-serif;white-space:nowrap}
.coin i{position:absolute;top:-6px;right:-6px;background:var(--r);color:#fff;font:800 13px Nunito;border-radius:99px;padding:1px 7px;font-style:normal}
.shopi b{font:800 16px "Baloo 2",sans-serif;color:#a86d00}.shopi.poor{opacity:.45}
.rw{display:grid;grid-template-columns:64px minmax(0,1fr) 80px 44px;gap:6px;align-items:center;margin:4px 0}
.rw select,.rw input{width:100%}
.tr{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) 40px 40px 40px 40px!important;padding:2px 4px;border-radius:10px}
.tr .btn{padding:0;justify-content:center}.tr.ok{background:light-dark(#e6f7ee,#173a2b)}.tr.ok [data-a=o]{background:var(--g);color:#fff}
.tr.ch input{border-color:var(--y);font-weight:800}.tr .lab{font:800 18px "Baloo 2",sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:4px 0 14px}.ctabs button{width:72px;height:64px;font-size:38px;border-radius:18px;background:var(--pale);border:3px solid transparent}
.ctabs button[aria-pressed=true]{border-color:var(--b);background:var(--board);box-shadow:0 4px 0 var(--b)}
.shopi.own{opacity:.6}.shopi.own b{color:var(--g)}
.piggy{display:flex;align-items:center;gap:8px;background:light-dark(#ffe9f0,#3a2433);border-radius:20px;padding:6px 12px;margin-bottom:12px;cursor:pointer;text-align:left}
.piggy .prog i span{background:linear-gradient(90deg,#ff8fb1,#e8433a)}
.world{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;min-height:110px;padding:14px 10px 10px;border-radius:22px;background:linear-gradient(light-dark(#bfe6ff,#1b2f4a) 0 55%,light-dark(#9fd88a,#21482a) 55%)}
.world button{font-size:clamp(44px,9vw,70px);line-height:1}
.vrow{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
.prog i{display:block;height:12px;border-radius:9px;background:var(--pale);overflow:hidden}
.prog i span{display:block;height:100%;background:linear-gradient(90deg,var(--y),#ff9b3c);border-radius:9px}
.prog small{font:800 14px Nunito;color:var(--soft);white-space:nowrap}
h1{font:800 clamp(28px,6vw,44px)/1.05 "Baloo 2",Nunito,sans-serif;margin:8px 0 14px;text-align:center;text-wrap:balance}
h1 span{color:var(--r)}
.who{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.kid{background:var(--board);border:3px solid var(--line);border-radius:26px;padding:16px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 5px 0 var(--line)}
.kid .av{font-size:72px;line-height:1.1}
.kid b{font:800 24px "Baloo 2",sans-serif}
.kid small{color:var(--soft);font-weight:800}
.worlds{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.world{border-radius:24px;padding:10px;display:flex;align-items:center;justify-content:center;gap:4px;border:4px solid transparent;opacity:.55;background:var(--board)}
.world[aria-pressed=true]{opacity:1;border-color:currentColor;box-shadow:0 5px 0 currentColor}
.world.L{color:var(--r)}.world.N{color:var(--b)}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.gt{background:var(--board);border:3px solid var(--line);border-radius:24px;padding:12px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 5px 0 var(--line);min-height:150px}
.gt:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
.gi{min-height:84px;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:2px;font-size:52px;line-height:1}
.gl{font:800 15px/1.15 Nunito,sans-serif;color:var(--soft)}
.gs{font-size:13px;color:var(--soft);font-weight:800}
.mt{display:inline-grid;place-items:center;min-width:36px;height:42px;padding:0 6px;border-radius:10px;color:#fff;font:800 26px/1 "Baloo 2",sans-serif;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.mt.big{min-width:52px;height:60px;font-size:38px}
.stage{background:var(--board);border:3px solid var(--line);border-radius:28px;padding:clamp(14px,4vw,30px);min-height:480px;text-align:center;position:relative;overflow:hidden}
.dots{display:flex;gap:6px;justify-content:center;flex:1}
.dots i{width:18px;height:18px;border-radius:50%;background:var(--pale);border:2px solid var(--line)}
.dots i.on{background:var(--y);border-color:#c79413}
.pic{font-size:clamp(96px,24vw,160px);line-height:1.1;margin:4px 0;display:inline-block;user-select:none}
.pop{animation:pop .5s}
.row{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:14px 0}
.slot{width:clamp(46px,11vw,70px);height:clamp(56px,13vw,82px);border:3px dashed var(--soft);border-radius:14px;display:grid;place-items:center;font:800 clamp(28px,7vw,46px)/1 "Baloo 2",sans-serif}
.slot.f{border-style:solid;border-color:var(--g);background:light-dark(#e6f7ee,#173a2b)}
.slot.pre{border-style:solid;border-color:var(--line);background:var(--pale);color:var(--soft)}
.slot.next{border-color:var(--b);border-width:4px}
.slot.wide{width:auto;min-width:clamp(80px,18vw,120px);padding:0 10px}
.tile{min-width:clamp(56px,12vw,76px);height:clamp(56px,12vw,76px);padding:0 8px;border-radius:16px;font:800 clamp(30px,7vw,44px)/1 "Baloo 2",sans-serif;color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.25),inset 0 2px 0 rgba(255,255,255,.35)}
.tile:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.tile.used{visibility:hidden}.tile.hint{outline:5px solid var(--y);outline-offset:3px}
.tile.xl{min-width:clamp(76px,19vw,110px);height:clamp(76px,19vw,110px);font-size:clamp(40px,10vw,62px)}
.c0{background:var(--r)}.c1{background:var(--b)}.c2{background:#e08a00}.c3{background:var(--g)}.c4{background:#8a4fd0}
.kb .tile{min-width:clamp(42px,9vw,58px);height:clamp(48px,10vw,60px);font-size:clamp(24px,5vw,34px)}
.no{animation:shake .4s}
.tools{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:10px}
.btn{border-radius:99px;padding:8px 18px;font-weight:800;background:var(--pale);display:inline-flex;align-items:center;gap:8px}
.btn.main{background:var(--y);color:#3a2a00;box-shadow:0 4px 0 #c79413}
.btn.red{background:var(--r);color:#fff}
.ib{width:64px;height:64px;border-radius:50%;display:inline-grid;place-items:center;font-size:30px;background:var(--pale);box-shadow:0 4px 0 var(--line)}
.ib.y{background:var(--y);box-shadow:0 4px 0 #c79413}.ib.g{background:var(--g);color:#fff;box-shadow:0 4px 0 #17734a}
.ib svg{width:32px;height:32px}
.opts{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin:16px 0}
.opt{background:light-dark(#fff7d6,#28324f);border:3px solid var(--line);border-radius:20px;font-size:clamp(54px,13vw,84px);width:clamp(96px,24vw,140px);height:clamp(96px,24vw,140px)}
.word{font:800 clamp(44px,11vw,80px)/1.1 "Baloo 2",sans-serif;letter-spacing:.06em;margin:10px 0}
.okno{display:flex;justify-content:center;align-items:center;gap:6px;margin:10px 0;flex-wrap:wrap}
.kol{display:flex;flex-direction:column;align-items:center;gap:4px}
.kol button.ar{width:64px;border-radius:14px;background:var(--pale);font-size:22px;font-weight:800}
.syl{font:800 clamp(48px,13vw,90px)/1 "Baloo 2",sans-serif;padding:8px 22px;border-radius:22px;background:var(--y);color:#3a2a00;box-shadow:0 5px 0 #c79413}
.syl.s{font-size:clamp(32px,8vw,52px);padding:8px 16px}
.msg{color:var(--soft);font-size:16px;max-width:52ch;margin:12px auto}
.ok{color:var(--g);font:800 26px "Baloo 2",sans-serif;min-height:38px;margin:4px 0}
.things{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 14px;margin:10px auto;max-width:560px}
.five{display:flex;gap:.08em;line-height:1.15}
.things{max-width:900px!important}
.x{opacity:.3;position:relative}
.ex{font:800 clamp(48px,12vw,84px)/1.1 "Baloo 2",sans-serif;margin:8px 0;white-space:nowrap}
.ex .q{display:inline-block;min-width:1.1em;border-bottom:6px solid var(--b);color:var(--b)}
.cmp{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin:8px 0}
.cmp .side{background:var(--pale);border-radius:18px;padding:10px 6px}
.cmp .n{font:800 clamp(48px,12vw,76px)/1 "Baloo 2",sans-serif}
.cmp .mid{font:800 clamp(48px,12vw,76px)/1 "Baloo 2",sans-serif;width:clamp(60px,14vw,90px);height:clamp(70px,16vw,100px);border:4px dashed var(--soft);border-radius:18px;display:grid;place-items:center}
.house{display:inline-block;margin:6px auto}
.house .roof{width:0;height:0;border-left:110px solid transparent;border-right:110px solid transparent;border-bottom:80px solid var(--r);position:relative;margin:0 auto}
.house .roof b{position:absolute;left:-30px;top:26px;width:60px;color:#fff;font:800 44px/1 "Baloo 2",sans-serif}
.house .fl{display:grid;grid-template-columns:1fr 1fr;width:180px;margin:0 auto;border:4px solid var(--r);border-top:0;background:var(--board)}
.house .fl span{height:78px;display:grid;place-items:center;font:800 46px/1 "Baloo 2",sans-serif}
.house .fl span+span{border-left:4px solid var(--r)}
.line{display:flex;justify-content:center;gap:0;margin:24px auto 10px;position:relative;max-width:560px}
.line::before{content:"";position:absolute;left:0;right:0;top:50%;height:5px;background:var(--soft);border-radius:4px}
.line span{position:relative;flex:1;display:grid;place-items:center}
.line span b{background:var(--board);border:4px solid var(--b);border-radius:16px;width:clamp(52px,12vw,76px);height:clamp(58px,13vw,80px);display:grid;place-items:center;font:800 clamp(30px,7vw,44px)/1 "Baloo 2",sans-serif}
.line span b.q{border-style:dashed;color:var(--b)}
.clap{width:clamp(120px,32vw,170px);height:clamp(120px,32vw,170px);border-radius:50%;font-size:clamp(64px,17vw,96px);background:var(--y);box-shadow:0 7px 0 #c79413}
.clap:active{transform:translateY(4px);box-shadow:0 3px 0 #c79413}
.cdots{display:flex;gap:10px;justify-content:center;min-height:40px;margin:10px 0}
.cdots i{width:34px;height:34px;border-radius:50%;background:var(--r)}
.fx{position:absolute;pointer-events:none;font:800 30px "Baloo 2",sans-serif;animation:fly 1.2s ease-out forwards}
.ov{position:fixed;inset:0;background:rgba(10,14,30,.55);display:none;align-items:flex-start;justify-content:center;padding:4vh 12px;z-index:9;overflow:auto}
.ov.show{display:flex}
.sheet{background:var(--board);border-radius:22px;padding:20px;max-width:780px;width:100%;text-align:left}
.sheet h2{font:800 26px/1.1 "Baloo 2",sans-serif;margin:0 0 8px}
.sheet h3{font:800 19px "Baloo 2",sans-serif;margin:20px 0 6px;padding-top:12px;border-top:2px solid var(--line)}
.badge{text-align:center;padding:20px}
.badge .av{font-size:120px;line-height:1.1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(50px,1fr));gap:6px}
.lt{height:50px;border-radius:12px;font:800 22px "Baloo 2",sans-serif;background:var(--pale);color:var(--soft);position:relative}
.lt.on{background:var(--b);color:#fff}.lt.auto{opacity:.55;cursor:default}
.lt small{position:absolute;bottom:1px;left:0;right:0;font:700 10px Nunito,sans-serif}
.chk{display:flex;gap:10px;align-items:center;margin:6px 0;min-height:44px}
.chk input{width:24px;height:24px;flex:none}
select,input[type=number],input[type=text]{font-size:16px;padding:8px 10px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink);min-height:44px}
.avs{display:flex;flex-wrap:wrap;gap:6px}
.avs button{font-size:32px;width:54px;height:54px;border-radius:14px;background:var(--pale)}
.avs button[aria-pressed=true]{outline:4px solid var(--b)}
.ptabs{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.ptabs button{border-radius:99px;padding:4px 14px;background:var(--pale);font-weight:800}
.ptabs button[aria-pressed=true]{background:var(--b);color:#fff}
.stat{display:grid;grid-template-columns:minmax(0,9em) minmax(0,1fr) 5.5em;gap:8px;align-items:center;font-size:15px;margin:4px 0}
.stat i{display:block;height:14px;background:var(--pale);border-radius:8px;overflow:hidden}
.stat i span{display:block;height:100%;background:var(--g)}
.stat em{font-style:normal;text-align:right;white-space:nowrap;color:var(--soft)}
.chips{display:flex;flex-wrap:wrap;gap:6px;font-size:14px}
.chips span{background:var(--pale);border-radius:99px;padding:2px 10px}
.warn{background:light-dark(#ffe6e3,#4a1f1c);border-radius:12px;padding:10px 12px;font-size:15px}
.note{color:var(--soft);font-size:14px}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@keyframes pop{50%{transform:scale(1.18) rotate(-4deg)}}
@keyframes fly{to{transform:translate(var(--x),var(--y2)) rotate(var(--rot));opacity:0}}
@media(min-width:700px){.wrap{max-width:1100px}.pic{font-size:clamp(120px,min(20vw,24vh),210px)}.tile.xl{min-width:120px;height:120px;font-size:70px}.tile{min-width:84px;height:84px;font-size:50px}
.opt{width:170px;height:170px;font-size:110px}.gt{min-height:190px}.gi{font-size:58px;min-height:100px;flex-wrap:nowrap;gap:4px}.gl{font-size:18px}.mt{min-width:44px;height:52px;font-size:32px}
.slot{width:84px;height:96px;font-size:56px}.syl{font-size:110px}.syl.s{font-size:64px}.ex{font-size:100px}.word{font-size:96px}.round{width:64px;height:64px}.ib{width:76px;height:76px;font-size:36px}}
@media(max-width:600px){.mascot{width:56px;opacity:.9}}
@media(max-width:420px){.games,.who{grid-template-columns:1fr 1fr}.gt{min-height:130px}.gi{font-size:44px}}
.sky{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.wrap{position:relative;z-index:1}
html{background:light-dark(#d9f2ff,#141a2e)}
body{background:linear-gradient(light-dark(#8fd3ff,#0d1630),light-dark(#d4efff,#1a2446) 45%,light-dark(#fff7d6,#1e2742) 85%) fixed!important;min-height:100vh}
.sun{position:absolute;right:6vw;top:4vh;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,light-dark(#fff2b0,#f3f1ea) 0 38%,light-dark(#ffc93c,#c9cfe6) 52%,transparent 70%);animation:glow 6s ease-in-out infinite}
@keyframes glow{50%{transform:scale(1.08)}}
.cl{position:absolute;left:-260px;width:170px;height:52px;border-radius:52px;background:light-dark(#fff,#2b3760);opacity:.92;animation:drift linear infinite}
.cl::before,.cl::after{content:"";position:absolute;background:inherit;border-radius:50%}
.cl::before{width:72px;height:72px;left:24px;top:-36px}.cl::after{width:92px;height:92px;left:64px;top:-52px}
.c1{top:14vh;animation-duration:75s}.c2{top:30vh;animation-duration:100s;animation-delay:-45s;scale:.7}.c3{top:7vh;animation-duration:130s;animation-delay:-85s;scale:1.15}
@keyframes drift{to{left:110vw}}
.hills{position:absolute;left:0;bottom:0;width:100%;height:22vh}.hills .h1{fill:light-dark(#b5e6a0,#1f3d2a)}.hills .h2{fill:light-dark(#86cf6c,#183223)}
#floaters span{position:absolute;bottom:-90px;font:800 44px "Baloo 2",sans-serif;opacity:.22;animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-125vh) rotate(30deg)}}
.stage{box-shadow:0 14px 34px rgba(30,70,140,.14)}
.gt,.kid,.world,.bdg{animation:popin .45s cubic-bezier(.2,1.4,.5,1) both;animation-delay:calc(var(--i,0)*55ms)}
@keyframes popin{from{transform:scale(.6) translateY(24px);opacity:0}}
.gt{transition:transform .15s}.gt:hover{transform:translateY(-4px)}
.hero{display:flex;align-items:center;justify-content:center;gap:10px;margin:6px 0 10px}
.hero .owl{width:clamp(90px,18vw,140px);animation:hop 2.6s ease-in-out infinite}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.bubble{background:var(--board);border-radius:22px;padding:8px 16px;font:800 clamp(22px,5vw,34px)/1.1 "Baloo 2",sans-serif;position:relative;box-shadow:0 6px 0 var(--line)}
.bubble::before{content:"";position:absolute;left:-14px;top:40%;border:10px solid transparent;border-right:16px solid var(--board)}
.owl .eye{transform-origin:center;transform-box:fill-box;animation:blink 5s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}

let rTok=0;
const hearBtn=(id)=>'<button class="ib y" id="'+id+'" aria-label="Poslechnout">'+SPK+'</button>';

/* --- 1 skládám slova --- */
function gSlova(){const k=known();const full=fullW();const part=S().partial?WORDS.filter(w=>{const n=w.g.filter(eff).length;return n>=2&&n<w.g.length}):[];
  const cand=full.length>=25?full:full.concat(part);if(!cand.length)return empty('Zapněte víc písmen. Ze zapnutých písmen zatím nejde složit žádné slovo.');
  const w=draw('slova',cand,x=>x.w);const pre=w.g.map(l=>!eff(l));const need=w.g.filter(eff);
  let tiles;if(+S().kb)tiles=k.map(l=>({l,u:false}));else{const ex=shuf(k.filter(l=>!need.includes(l))).slice(0,Math.min(3,Math.max(1,7-need.length)));tiles=shuf([...need,...ex]).map(l=>({l,u:false}))}
  const W={w,pre,i:pre.indexOf(false),tiles,done:false,err:0};
  const paint=()=>{stage().innerHTML='<div><span class="pic'+(W.done?' pop':'')+'">'+w.e+'</span></div>'+hearBtn('hear')
    +'<div class="row">'+w.g.map((l,x)=>'<div class="slot'+(pre[x]?' pre':x<W.i||W.done?' f':x===W.i?' next':'')+'">'+(pre[x]||x<W.i||W.done?disp(l):'')+'</div>').join('')+'</div>'
    +(W.done?'':'<div class="row'+(+S().kb?' kb':'')+'" id="tiles">'+W.tiles.map((t,x)=>'<button class="tile '+col(t.l)+(t.u?' used':'')+'" data-k="'+x+'">'+disp(t.l)+'</button>').join('')+'</div>'
    +'<div class="tools"><button class="ib" id="hint" aria-label="Nápověda">💡</button><button class="ib" id="skip" aria-label="Jiné slovo">🔄</button></div>');
    $('hear').onclick=()=>say(sp(w.w));
    if(W.done)return nextBtn(gSlova);
    $('hint').onclick=()=>{const x=W.tiles.findIndex(t=>!t.u&&t.l===w.g[W.i]);sayL(w.g[W.i]);const b=stage().querySelector('[data-k="'+x+'"]');if(b)b.classList.add('hint');W.err++;R.err=1};
    $('skip').onclick=gSlova;
    $('tiles').onclick=ev=>{const b=ev.target.closest('.tile');if(!b)return;const t=W.tiles[+b.dataset.k];
      if(t.l===w.g[W.i]){sayL(t.l);hit('L:'+t.l);if(!+S().kb)t.u=true;W.i++;while(W.i<w.g.length&&pre[W.i])W.i++;
        if(W.i>=w.g.length){W.done=true;paint();sayQ(sp(w.w),60);win('slova',!W.err)}else paint()}
      else{W.err++;miss('slova','L:'+w.g[W.i],b);sayL(t.l);if(W.err===2)again('slova',w.w)}}};
  paint();sayQ(sp(w.w))}

/* --- 2 na co začíná --- */

  const w=draw('zacina',p,x=>x.w);const f=w.g[0];const fb=LONG[f]||f;
  const opts=shuf([f,...fresh(k.filter(l=>l!==f&&(LONG[l]||l)!==fb),3,l=>'L'+l)]);
  stage().innerHTML='<div><span class="pic" id="pic">'+w.e+'</span></div>'+hearBtn('hear')+'<div class="row" id="o">'+opts.map(l=>'<button class="tile xl '+col(l)+'" data-l="'+l+'">'+disp(l)+'</button>').join('')+'</div><p class="ok" id="ok"></p>';
  $('hear').onclick=()=>say(sp(w.w));sayQ(sp(w.w));let done=false;
  $('o').onclick=ev=>{const b=ev.target.closest('.tile');if(!b||done)return;
    if(b.dataset.l===f){done=true;$('pic').classList.add('pop');$('ok').textContent=disp(w.w);say(low(w.w)+' začíná na písmenko '+pn(f)+'.');hit('L:'+f);win('zacina');nextBtn(gZacina)}

/* --- 3 najdi písmenko --- */

  $('o').onclick=ev=>{const b=ev.target.closest('.tile');if(!b||done)return;
    if(b.dataset.l===L){done=true;b.classList.add('pop');if(e)$('ok').innerHTML='<span style="font-size:60px">'+e.e+'</span> '+disp(e.w);say(e?[ln(L,true)+' jako',low(e.w)]:ln(L,true));hit('L:'+L);win('najdi');nextBtn(gNajdi)}

/* --- 4 čtecí okénko --- */
const O={c:0,v:0};
function gOkenko(){const k=known();const C=k.filter(l=>!VOW.has(l)),V=k.filter(l=>VOW.has(l));
  if(!C.length||!V.length)return empty('Okénko potřebuje aspoň jednu souhlásku (např. M) a jednu samohlásku (např. A).');
  O.c%=C.length;O.v%=V.length;const s=()=>C[O.c]+V[O.v];
  stage().innerHTML='<div class="okno"><div class="kol"><button class="ar" id="cu" aria-label="nahoru">▲</button><span class="tile xl '+col(C[O.c])+'" style="display:grid;place-items:center">'+disp(C[O.c])+'</span><button class="ar" id="cd" aria-label="dolů">▼</button></div>'
  +'<div class="kol"><button class="ar" id="vu" aria-label="nahoru">▲</button><span class="tile xl c2" style="display:grid;place-items:center">'+disp(V[O.v])+'</span><button class="ar" id="vd" aria-label="dolů">▼</button></div>'
  +'<span style="font-size:40px">=</span><button class="syl" id="syl" aria-label="Přečíst">'+disp(s())+'</button></div>'
  +'<div class="tools"><button class="btn main" id="quiz" style="font-size:22px">👂 ❓</button></div><div id="qz"></div>';
  const mv=(key,d,len)=>{O[key]=(O[key]+d+len)%len;gOkenko();say(spS(s()))};
  $('cu').onclick=()=>mv('c',-1,C.length);$('cd').onclick=()=>mv('c',1,C.length);$('vu').onclick=()=>mv('v',-1,V.length);$('vd').onclick=()=>mv('v',1,V.length);
  $('syl').onclick=()=>say(spS(s()));
  $('quiz').onclick=()=>{const all=[];C.forEach(c=>V.forEach(v=>all.push(c+v)));if(all.length<2)return;
    const t=draw('slab',all,x=>x),o=shuf([t,...shuf(all.filter(x=>x!==t)).slice(0,2)]);
    $('qz').innerHTML='<div class="tools">'+hearBtn('qh')+'</div><div class="row" id="qo">'+o.map(x=>'<button class="syl s" data-s="'+x+'">'+disp(x)+'</button>').join('')+'</div>';
    const play=()=>say(spS(t));play();$('qh').onclick=play;let done=false;
    $('qo').onclick=ev=>{const b=ev.target.closest('[data-s]');if(!b||done)return;
      if(b.dataset.s===t){done=true;b.classList.add('pop');say('Správně, '+low(t));win('okenko');setTimeout(()=>{if(view==='game'&&cur==='okenko')$('quiz').click()},2200)}else{miss('okenko','S:'+t,b);say(spS(b.dataset.s))}}}}

/* --- 5 slabiky --- */
function gSlabiky(){const multi=WORDS.filter(w=>w.s.length>1);let cand=multi.filter(w=>w.g.every(eff));
  if(cand.length<8&&S().partial)cand=cand.concat(multi.filter(w=>!w.g.every(eff)&&w.g.filter(eff).length*2>=w.g.length));
  if(!cand.length)return empty('Zapněte víc písmen, aby šla složit slova ze slabik.');
  const w=draw('slabiky',cand,x=>x.w);const other=pick(multi.filter(x=>x.w!==w.w));const ex=other.s.find(s=>!w.s.includes(s));
  const tiles=shuf([...w.s,...(ex?[ex]:[])]).map(s=>({s,u:false}));let i=0,err=0;
  const paint=(done)=>{stage().innerHTML='<div><span class="pic'+(done?' pop':'')+'">'+w.e+'</span></div>'+hearBtn('hear')
    +'<div class="row">'+w.s.map((s,x)=>'<div class="slot wide'+(x<i?' f':x===i?' next':'')+'">'+(x<i?disp(s):'')+'</div>').join('')+'</div>'
    +(done?'':'<div class="row" id="t">'+tiles.map((t,x)=>'<button class="syl s'+(t.u?' used" style="visibility:hidden':'')+'" data-k="'+x+'">'+disp(t.s)+'</button>').join('')+'</div>');
    $('hear').onclick=()=>say(sp(w.w));if(done)return nextBtn(gSlabiky);
    $('t').onclick=ev=>{const b=ev.target.closest('[data-k]');if(!b)return;const t=tiles[+b.dataset.k];
      if(t.s===w.s[i]){t.u=true;i++;say(spS(t.s));if(i===w.s.length){paint(true);sayQ(sp(w.w),60);win('slabiky',!err)}else paint()}
      else{err++;miss('slabiky','S:'+w.s[i],b);say(spS(t.s));again('slabiky',w.w)}}};
  paint();sayQ(sp(w.w))}

  +'<div class="tools" style="align-items:center;gap:18px"><button class="ib" id="rs" aria-label="Znovu">↺</button><button class="clap" id="cl" aria-label="Tlesknout">👏</button><button class="ib g" id="ok" aria-label="Hotovo">✔</button></div><p class="ok" id="res"></p>';

    else{miss('tleskani','W:'+w.w,$('cd'));$('res').innerHTML=w.s.map(()=>'👏').join(' ');say(w.s.map(low));n=0;setTimeout(dots,300);again('tles',w.w)}}}

/* --- 11 příklady --- */
const recent=[];
function makeEx(){const s=S(),m=mx(),ops=s.ops&&s.ops.length?s.ops:['+'];
  for(let t=0;t<80;t++){const op=pick(ops);let a,b,c;
    if(op==='+'){c=rnd(1,m);a=rnd(0,c);b=c-a}else{a=rnd(1,m);b=rnd(0,a);c=a-b}
    if((a===0||b===0)&&Math.random()<.8)continue;
    const cross=op==='+'?Math.floor(a/10)!==Math.floor((c-.5)/10)&&a%10!==0&&b%10!==0:Math.floor(a/10)!==Math.floor(c/10)&&a!==10&&c%10!==0;
    if(cross&&!s.cross)continue;const key=a+op+b;if(recent.includes(key)&&t<70)continue;
    recent.push(key);if(recent.length>12)recent.shift();return {a,b,c,op}}
  return {a:1,b:1,c:2,op:'+'}}
function gPriklady(){const m=mx();const {a,b,c,op}=makeEx();const aid=S().aid&&Math.max(a,b,c)<=20;const it=pick(ITEMS);
  const vis=aid?(op==='+'?'<div class="things" style="align-items:center">'+things(a,0,it,.7)+'<b style="font-size:56px">+</b>'+things(b,0,it,.7)+'</div>':things(a,b,it)):'';
  stage().innerHTML=vis+'<div class="ex">'+a+' '+(op==='-'?'−':'+')+' '+b+' = <span class="q" id="q">?</span></div>'+numOpts(c,0,m,'o');
  const txt=nwd(a)+(op==='+'?' plus ':' mínus ')+nwd(b);sayQ(txt);let done=false;
  $('o').onclick=ev=>{const x=ev.target.closest('[data-n]');if(!x||done)return;
    if(+x.dataset.n===c){done=true;$('q').textContent=c;$('q').classList.add('pop');say(txt+' je '+nwd(c));hit('N:'+c);win('priklady');nextBtn(gPriklady)}
    else{miss('priklady','E:'+a+op+b,x);say([numS(+x.dataset.n),'Zkus to znovu.'])}}}

function vReport(){const keep=vsec;const out=['Písmenkové hrátky – test výslovnosti'];const names={L:'Písmena',W:'Slova',S:'Slabiky',N:'Čísla'};

      if(b.dataset.a==='p'){const inp=r.querySelector('input');if(inp.value.trim()!==vCur(k)){setPron(k,inp.value);r.classList.toggle('ch',vCur(k)!==vDef(k))}playK(k)}
      if(b.dataset.a==='v'){const vs=vVar(k),i=vs.indexOf(vCur(k)),nx=vs[(i+1)%vs.length];setPron(k,nx);r.querySelector('input').value=vCur(k);r.classList.toggle('ch',vCur(k)!==vDef(k));playK(k)}
      if(b.dataset.a==='r'){setPron(k,'');r.querySelector('input').value=vDef(k);r.classList.remove('ch');playK(k)}
      if(b.dataset.a==='o'){ST.pok=ST.pok||{};if(ST.pok[k])delete ST.pok[k];else ST.pok[k]=1;r.classList.toggle('ok',!!ST.pok[k]);save()}}}
  if(tab==='hlas'){q('vl').onchange=e=>{if(e.target.name==='vp'){VP=e.target.value;try{localStorage.setItem('pismenka-voice3',VP)}catch(x){}say('Ahoj! Tímhle hlasem teď budu mluvit.');drawSet()}};
    q('vl').onclick=e=>{const b=e.target.closest('[data-t]');if(b)say(['Ahoj! Máma mele maso.','Jedna, dvě, tři.'],b.dataset.t)};
    q('oRate').oninput=e=>{p.set.rate=+e.target.value;save()};q('oRate').onchange=()=>say('Takhle rychle budu mluvit.')}
  if(tab==='vys')q('rst').onclick=()=>{p.st={};fixP(p);save();drawSet()}}

/* navigace: systémové Zpět (Android), Esc, nouzový návrat */
function goBack(){
  if($('lvl').classList.contains('show')){if(popClose)popClose();else $('lvl').classList.remove('show');return true}
  if($('gate').classList.contains('show')){$('gate').classList.remove('show');return true}
  if($('set').classList.contains('show')){const c=$('close');if(c)c.click();else{$('set').classList.remove('show');render()}return true}
  if(view==='game'||view==='album'||view==='shop'){cur=null;view='home';render();return true}
  if(view==='home'){view='who';render();return true}
  return false}
try{history.pushState({g:1},'')}catch(e){}
window.addEventListener('popstate',()=>{let h=false;try{h=goBack()}catch(e){toMenu()}if(h){try{history.pushState({g:1},'')}catch(e){}}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){try{goBack()}catch(x){toMenu()}}});
function toMenu(){const o=$('oops');if(o)o.remove();['lvl','gate','set'].forEach(i=>$(i).classList.remove('show'));PQ.length=0;popClose=null;cur=null;view=P()?'home':'who';try{render()}catch(x){location.reload()}}
window.addEventListener('error',e=>{if(!e.error||$('oops'))return;const t=document.createElement('div');t.id='oops';t.className='oops';t.innerHTML='<span style="font-size:30px">🦉</span><b>Jejda, něco se zaseklo.</b><button class="btn main" id="oopsGo">🏠 Do menu</button>';document.body.appendChild(t);$('oopsGo').onclick=toMenu});
fixAll();
if(ST.cur&&P()){view='home'}
render();
}
</script>
